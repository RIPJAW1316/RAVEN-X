name: Raven-X supported regression

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run complete suite
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build portal from lockfile
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install chromium
      - name: Run portal enrollment and report workflow
        working-directory: frontend
        run: |
          $env:RAVENX_TEST_PYTHON = (Get-Command python).Source
          npm run test:e2e
